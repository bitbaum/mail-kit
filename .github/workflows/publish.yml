name: Publish

# Publishing is driven by a version tag, so the released artifact is always
# traceable to a commit. `npm version` creates the tag; pushing it ships.
#
# Auth is npm Trusted Publishing (OIDC): npmjs.com trusts exactly THIS
# workflow in THIS repo (configured 2026-09-05). No token exists anywhere —
# nothing to store, leak, or rotate — and provenance is attested on the
# registry. `npm publish` (npm >= 11.5) exchanges the id-token itself.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token IS the publish credential.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Never publish something that would not have passed CI.
      - run: pnpm run verify

      # Refuse to publish a tag whose version does not match package.json,
      # rather than silently shipping the wrong number.
      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi

      # npm (not pnpm) does the publish: the npm CLI implements the OIDC
      # token exchange for trusted publishing natively. dist/ is already
      # built by `verify`.
      - name: Publish to npm (OIDC, tokenless)
        run: npm publish
